<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - FLP Sandbox</title>
  <script>
    window["sap-ushell-config"] = {
  "defaultRenderer": "fiori2",
  "applications": {
    "products-display": {
      "title": "Products",
      "description": "Fiori application for Products",
      "additionalInformation": "SAPUI5.Component=com.fiori.agent.northwind.products",
      "applicationType": "URL",
      "url": "../",
      "navigationMode": "embedded"
    }
  }
};
  </script>
  <script src="https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-async="true"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-xx-componentPreload="off"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-resourceroots='{"com.fiori.agent.northwind.products": "../"}'></script>
  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ushell.Container.createRenderer().placeAt("content");
    });
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content"></body>
</html>
